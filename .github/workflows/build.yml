name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x

      - name: Publish (needs .NET 9 Desktop Runtime)
        run: dotnet publish src/OpenSnip.csproj -c Release -r win-x64 --self-contained false -p:PublishSingleFile=true -p:DebugType=none -o dist/framework

      - name: Publish (standalone)
        run: dotnet publish src/OpenSnip.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:EnableCompressionInSingleFile=true -p:DebugType=none -o dist/standalone

      - name: Name artifacts
        shell: pwsh
        run: |
          Copy-Item dist/framework/OpenSnip.exe dist/OpenSnip.exe
          Copy-Item dist/standalone/OpenSnip.exe dist/OpenSnip-standalone.exe

      - uses: actions/upload-artifact@v4
        with:
          name: OpenSnip
          path: |
            dist/OpenSnip.exe
            dist/OpenSnip-standalone.exe

  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x

      - name: Test
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb libx11-6
          dotnet test tests/OpenSnip.Tests/OpenSnip.Tests.csproj -c Release --nologo

      - name: Publish
        run: dotnet publish linux/OpenSnip.Linux.csproj -c Release -r linux-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:EnableCompressionInSingleFile=true -p:DebugType=none -o dist/linux

      - name: Pack
        run: |
          mkdir -p dist/OpenSnip-linux-x64
          cp dist/linux/OpenSnip dist/OpenSnip-linux-x64/
          cp linux/packaging/install.sh dist/OpenSnip-linux-x64/
          cp linux/packaging/opensnip.desktop dist/OpenSnip-linux-x64/
          cp linux/packaging/opensnip.png dist/OpenSnip-linux-x64/
          cp LICENSE dist/OpenSnip-linux-x64/
          tar -czf dist/OpenSnip-linux-x64.tar.gz -C dist OpenSnip-linux-x64

      - uses: actions/upload-artifact@v4
        with:
          name: OpenSnip-linux-x64
          path: dist/OpenSnip-linux-x64.tar.gz

  release:
    runs-on: ubuntu-latest
    needs: [windows, linux]
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/OpenSnip.exe
            dist/OpenSnip-standalone.exe
            dist/OpenSnip-linux-x64.tar.gz
          generate_release_notes: true
